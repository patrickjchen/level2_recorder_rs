[package]
name = "l2_recorder"
version = "0.1.0"
edition = "2021"
description = "Multi-threaded Binance L2 recorder: one reader per feed, parse/dedup, binary persist"

[lib]
name = "l2_recorder"
path = "src/lib.rs"

[[bin]]
name = "l2_recorder"
path = "src/bin/l2_recorder.rs"

[[bin]]
name = "l2_dump"
path = "src/bin/l2_dump.rs"

[[bin]]
name = "l2_to_csv"
path = "src/bin/l2_to_csv.rs"

[dependencies]
rtrb          = "0.4"
tungstenite   = { version = "0.30", features = ["rustls-tls-native-roots"] }
# tungstenite pulls rustls without a crypto provider; pick ring explicitly.
rustls        = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sonic-rs      = "0.5"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
bytemuck      = { version = "1", features = ["derive"] }
core_affinity = "0.8"
ctrlc         = { version = "3", features = ["termination"] }
clap          = { version = "4", features = ["derive"] }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
debug         = 1
